[package]
name = "gm-ffi"
description = "GramMusic: API C cho app iOS (thư viện tĩnh libgm_ffi.a)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
# Chỉ staticlib: thêm rlib thì cargo tắt LTO (thư viện 86 MB thay vì vài MB — GramMini D13)
crate-type = ["staticlib"]

[dependencies]
gm-core = { path = "../gm-core" }
gm-net = { path = "../gm-net" }
tokio = { workspace = true }
serde_json = "1"
